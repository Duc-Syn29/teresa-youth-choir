name = "teresa-admin-api"
main = "worker.js"
compatibility_date = "2026-08-13"

[vars]
ENVIRONMENT = "production"
ARCHIVE_YEAR_MIN = "2015"
GITHUB_OWNER = "Duc-Syn29"
GITHUB_REPO = "teresa-youth-choir"
GITHUB_BRANCH = "main"
PUBLISH_BRANCH = "main"
ALLOWED_ORIGINS = "https://cadoangioitreteresa.org,https://www.cadoangioitreteresa.org,https://teresa-youth-choir.pages.dev"
ALLOWED_ORIGIN_SUFFIXES = ""
REQUIRE_VERIFIED_EMAIL = "false"
R2_PUBLIC_BASE_URL = ""
RELEASE = "worker-v3"

[observability]
enabled = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "teresa-choir-images"

# Một namespace riêng trong tài khoản Cloudflare. Có thể đổi số nếu namespace
# 1001 đã được dùng bởi Worker khác.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Preview ghi JSON vào branch `preview` và ảnh vào bucket tách biệt. Binding và
# secrets của environment không kế thừa production; xem README trước khi deploy.
[env.preview.vars]
ENVIRONMENT = "preview"
ARCHIVE_YEAR_MIN = "2015"
GITHUB_OWNER = "Duc-Syn29"
GITHUB_REPO = "teresa-youth-choir"
GITHUB_BRANCH = "preview"
PUBLISH_BRANCH = "main"
ALLOWED_ORIGINS = "https://teresa-youth-choir.pages.dev"
ALLOWED_ORIGIN_SUFFIXES = ".teresa-youth-choir.pages.dev"
REQUIRE_VERIFIED_EMAIL = "false"
R2_PUBLIC_BASE_URL = ""
RELEASE = "worker-v3-preview"

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "teresa-choir-images-preview"

[[env.preview.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
